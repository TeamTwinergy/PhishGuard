# Render Blueprint: deploys the FastAPI backend. Frontend goes to Vercel (see README).
services:
  - type: web
    name: phishguard-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: PHISHGUARD_CORS_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://phishguard.vercel.app
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false   # optional; leave empty to run in heuristic-only mode
